name: Jarvis

# GitHub's scheduler is unreliable for frequent crons (runs get delayed or never
# start), so each run stays alive and checks in every 5 minutes by itself until
# 22:00 UTC or for about 5h45m, whichever comes first. The schedule below only has
# to start a run now and then; the concurrency group keeps it to one at a time.
# 12:00-21:59 UTC covers the US pre-market brief, the session and the recap in
# both US summer and winter time. Jarvis works out New York time itself.
# Outside those hours a run does one check-in and stops, every 30 minutes, so
# Telegram commands (/status etc.) still get an answer during the Australian day.
on:
  schedule:
    - cron: "*/10 12-21 * * 1-5"
    - cron: "15,45 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/jarvis.yml"
      - "jarvis/**"

permissions:
  contents: write

concurrency:
  group: jarvis
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jarvis check-ins (every 5 minutes)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          git config user.name "jarvis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          started=$(date +%s)
          save() {
            git add state/jarvis.json docs/state.json trader/ || true
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "Jarvis check-in [skip ci]"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && return 0
              sleep 5
            done
            echo "could not push state"
          }
          while true; do
            echo "::group::check-in $(date -u +%H:%M) UTC"
            python jarvis/jarvis.py || echo "check-in failed (will try again next time)"
            save
            echo "::endgroup::"
            now=$(date +%s)
            hour=$(date -u +%-H)
            # Stop near the job time limit, or once the US day is over.
            if [ $((now - started)) -gt 20400 ] || [ "$hour" -ge 22 ] || [ "$hour" -lt 12 ]; then
              echo "done for this run"; break
            fi
            # Sleep to the next 5-minute mark.
            sleep $(( 300 - now % 300 ))
          done
