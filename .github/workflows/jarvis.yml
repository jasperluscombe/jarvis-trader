name: Jarvis

# GitHub's scheduler is unreliable (it skipped most of our slots, including the
# 10:30 PM Adelaide start), so Jarvis keeps itself running: each run checks in
# by itself for about 5h40m (every 5 minutes while the US market is around,
# 12:00-21:59 UTC Mon-Fri, otherwise every 30 minutes), then starts the next run
# before it ends. The schedule is only a backup to restart the chain if it ever
# breaks; the concurrency group keeps it to one run at a time.
on:
  schedule:
    - cron: "*/10 12-21 * * 1-5"
    - cron: "15,45 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/jarvis.yml"
      - "jarvis/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: jarvis
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jarvis check-ins
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          git config user.name "jarvis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          started=$(date +%s)
          save() {
            git add state/jarvis.json docs/state.json trader/ || true
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "Jarvis check-in [skip ci]"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && return 0
              sleep 5
            done
            echo "could not push state"
          }
          while true; do
            echo "::group::check-in $(date -u +%H:%M) UTC"
            python jarvis/jarvis.py || echo "check-in failed (will try again next time)"
            save
            echo "::endgroup::"
            now=$(date +%s)
            hour=$(date -u +%-H); dow=$(date -u +%u)
            if [ "$dow" -le 5 ] && [ "$hour" -ge 12 ] && [ "$hour" -le 21 ]; then
              step=300     # market hours: every 5 minutes
            else
              step=1800    # otherwise: every 30 minutes (for Telegram replies)
            fi
            wait=$(( step - now % step ))
            # Hand over to the next run before the job time limit.
            if [ $((now + wait - started)) -gt 20400 ]; then
              echo "handing over to the next run"; break
            fi
            sleep $wait
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jarvis.yml --ref main --repo "$GITHUB_REPOSITORY"
